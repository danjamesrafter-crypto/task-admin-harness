<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Admin Console (live harness)</title>
<!--
  Task Admin Console, live-data harness. Sister app to the Reader Shell harness.
  Runs as a Flywheel extension app (Viewer type, matched to projects). All data goes through the
  Extension SDK's apiRequest proxy, so this page never sees a token.
  Open with #demo (or the "Use demo data" button) to run on mock data shaped like the 23.x API.
  Spike harness, not the product: the product mounts at /admin/ (or a route in core), like /reader/.
  Every endpoint marked VERIFY is an assumption; the Diagnostics panel records what the server accepted.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif:wght@400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070D18;--panel:#0E1A2B;--panel2:#0B1525;--line:#1E2F4A;--line2:#27395A;--fg:#E7EAF0;--mute:#A3ACBA;--dim:#7F8897;--accent:#2269E9;--warn:#F5C98A;--bad:#FF9B93;--ok:#7DDBAE;
--c-done:#4CC38A;--c-ip:#B080FC;--c-todo:#4C7CF0;--c-od:#F2645A;--c-un:#F0B35E;--c-blk:#5B6B85}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "Inter Tight",system-ui,sans-serif}
html{scrollbar-color:#27395A #070D18;scrollbar-width:thin}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5AA9F0;outline-offset:2px}
h1{margin:0;font:400 28px/1.15 "Noto Serif",Georgia,serif;letter-spacing:-.01em}
h2{margin:0;font-size:15px;font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}.dim{color:var(--dim)}
.shell{display:flex;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;flex:none;width:236px;display:flex;flex-direction:column;gap:14px;padding:16px 12px;border-right:1px solid #182740;background:#0A1322;overflow-y:auto}
.rail.min{width:68px;align-items:center}
.brand{display:flex;align-items:flex-start;gap:8px}
.brand .nm{flex:1;display:flex;flex-direction:column;gap:4px;padding-left:4px;min-width:0}
.brand .nm span{font-size:10px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.ib{width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line);background:transparent;color:#C9D0DA;display:flex;align-items:center;justify-content:center;padding:0}
.ib:hover,.hov:hover{background:#162842}
.ib svg{width:18px;height:18px}
.rl{font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:0 8px}
.pj{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:0 8px;border-radius:9px;border:none;background:transparent;color:var(--fg);text-align:left;font:600 13px "IBM Plex Mono",monospace}
.pr{display:flex;align-items:center;gap:8px;width:100%;min-height:38px;padding:6px 10px 6px 30px;border-radius:9px;border:none;background:transparent;color:#C9D0DA;text-align:left;font-size:13px;font-weight:500}
.pr[aria-current="page"]{background:#16294A;color:#fff}
.pr .v{color:var(--mute);font-weight:400}
.cnt{margin-left:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(242,100,90,.18);color:var(--bad)}
.mini{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#C9D0DA;font:600 10px "IBM Plex Mono",monospace;overflow:hidden}
.mini[aria-current="true"]{border-color:var(--accent);background:#16294A;color:#fff}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid #182740}
.av{width:30px;height:30px;border-radius:999px;background:#1A2B45;color:#C9D0DA;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.main{flex:1;min-width:0;padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}
.top .t{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:6px}
.crumb{font:12px "IBM Plex Mono",monospace;color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:#C9D0DA}
.chip.live i{width:8px;height:8px;border-radius:99px;background:var(--c-done)}
.chip.demo{border-color:#6B5530;color:var(--warn)}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{height:32px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #182740}
.tab{height:42px;padding:0 14px;border:none;background:none;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab[aria-current="page"]{color:#fff;border-color:var(--accent)}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(240,179,94,.18);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}.ph h2{flex:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:#C9D0DA}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.donut{position:relative;width:156px;height:156px;border-radius:999px;flex:none}
.donut>div{position:absolute;inset:22px;border-radius:999px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center}
.tbl{border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid #16243A;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#112036}
.lnk{border:none;background:none;padding:0;color:var(--fg);font-weight:500;text-align:left;min-height:32px}
.lnk:hover{color:#AEB8FF;text-decoration:underline}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.sorth{border:none;background:none;padding:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit}
.sorth[data-on="1"]{color:var(--fg)}
.bar{display:flex;height:12px;border-radius:4px;overflow:hidden;background:#13233A}
.strip{position:relative;height:22px}
.strip .band{position:absolute;top:2px;bottom:2px;background:rgba(143,179,255,.08);border-radius:4px}
.strip .ax{position:absolute;top:11px;left:0;right:0;border-top:1px solid var(--line)}
.strip i{position:absolute;top:7px;width:9px;height:9px;margin-left:-4px;border-radius:99px;opacity:.85}
.strip b{position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;background:#E7EAF0;border-radius:1px}
.attn{display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);text-align:left}
.stage{display:flex;flex-direction:column;gap:6px;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);text-align:left}
.stage[aria-pressed="true"]{border-color:var(--accent);background:#16294A}
.flow{display:flex;align-items:stretch;min-width:900px}
.flow .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.flow .arr{width:32px;flex:none;display:flex;align-items:center;justify-content:center;color:#3A4E70}
.empty{padding:28px;text-align:center;color:var(--mute)}
.banner{padding:12px 14px;border-radius:12px;border:1px solid rgba(240,179,94,.45);background:rgba(240,179,94,.08);color:#F3E3C7}
.scrim{position:fixed;inset:0;background:rgba(3,7,14,.6);z-index:20;border:none;padding:0;cursor:default}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;z-index:21;background:var(--panel2);border-left:1px solid var(--line2);box-shadow:-24px 0 48px rgba(0,0,0,.45);overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(3,7,14,.72)}
.dlg{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.ob{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:#C9D0DA;font-size:13px;font-weight:500}
.ob[aria-pressed="true"]{border-color:var(--accent);background:#16294A;color:#fff}
.lab{font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #16243A;font-size:13px}
.kv span:first-child{color:var(--mute)}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 "IBM Plex Mono",monospace;color:#C9D0DA;margin:8px 0 0}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px}
summary{cursor:pointer;color:#A9D2FA;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 14px;border-radius:10px;background:#E7EAF0;color:#0A1322;font-weight:500;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid #16243A}
.steps{display:flex;gap:6px}.steps div{flex:1;display:flex;flex-direction:column;gap:5px}.steps i{height:4px;border-radius:99px;display:block}.steps span{font-size:11px}
@media (max-width:760px){.rail{width:68px;align-items:center}.rail .hide-min{display:none}.main{padding:18px 14px 40px}}
</style>
</head>
<body>
<div id="app"><div style="padding:24px" class="muted">Connecting to Flywheel…</div></div>
<script src="https://cdn.flywheel.io/sdk/extension/flywheel-extension-0.14.9.min.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var S = {
    ext: null, demo: false, user: null, origin: '', params: {}, opener: null,
    tasks: [], projects: {}, users: {}, loading: true, error: null, log: [], updated: null,
    project: null, protocol: null, screen: 'overview', rail: false,
    sortKey: 'od', sortDir: 'desc', wfStage: 'all', caseFilter: 'all', showNames: true,
    readerSel: null, caseSel: null, reassign: null, exportDlg: null, toast: '', busy: false,
    reports: {}, reportState: 'idle', repTimer: null, subcats: {}
  };
  try { var rs = localStorage.getItem('taskAdmin.railCollapsed'); if (rs !== null) S.rail = rs === '1'; } catch (e) {}

  var MARK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 38.83" style="width:22px;height:auto" role="img" aria-label="Flywheel"><defs><linearGradient id="fwg" x1="-1.23" y1="47.5" x2="30.03" y2="-4.02" gradientTransform="translate(-5)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#093af6"/><stop offset="0.5" stop-color="#1b68fa"/><stop offset="0.92" stop-color="#b080fc"/></linearGradient></defs><path fill="url(#fwg)" d="M27.46.79a1.25,1.25,0,0,0-1.63-.7L.79,10.14A1.25,1.25,0,0,0,0,11.3V19a1.22,1.22,0,0,0,.09.46,1.26,1.26,0,0,0,1.63.7l25-10a1.25,1.25,0,0,0,.79-1.16V1.25A1.18,1.18,0,0,0,27.46.79ZM22.33,14.71.79,23.27A1.25,1.25,0,0,0,0,24.43V34.5a1.26,1.26,0,0,0,.76,1.15L8,38.73a1.19,1.19,0,0,0,.49.1,1.25,1.25,0,0,0,1.26-1.25v-6.7a1.25,1.25,0,0,1,.79-1.16l12.7-5A1.25,1.25,0,0,0,24,23.54V15.88a1.27,1.27,0,0,0-.09-.47A1.25,1.25,0,0,0,22.33,14.71Z"/></svg>';
  var IC = {
    collapse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16M15.5 10l-2 2 2 2"/></svg>',
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M9 4v16M13.5 10l2 2-2 2"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    arrow: '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h13M11 5l5 5-5 5"/></svg>',
    refresh: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>',
    doc: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>'
  };
  var COL = { completed: 'var(--c-done)', in_progress: 'var(--c-ip)', todo: 'var(--c-todo)', overdue: 'var(--c-od)', unassigned: 'var(--c-un)', blocked: 'var(--c-blk)', cancelled: '#3A4E70' };
  var BADGE = { completed: ['rgba(76,195,138,.16)', '#7DDBAE'], in_progress: ['rgba(176,128,252,.18)', '#CDB0FF'], todo: ['rgba(76,124,240,.20)', '#B4C8FF'], overdue: ['rgba(242,100,90,.18)', '#FF9B93'], unassigned: ['rgba(240,179,94,.18)', '#F5C98A'], blocked: ['rgba(91,107,133,.25)', '#C9D0DA'], cancelled: ['rgba(58,78,112,.3)', '#A3ACBA'] };
  var LABEL = { completed: 'Complete', in_progress: 'In progress', todo: 'Not started', overdue: 'Overdue', unassigned: 'Unassigned', blocked: 'Blocked', cancelled: 'Cancelled' };

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function note(line) { S.log.push(new Date().toLocaleTimeString() + '  ' + line); if (S.log.length > 600) S.log.shift(); }
  function day(iso) { var p = String(iso).slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today0() { var t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  function days(iso) { return iso ? Math.round((day(iso) - today0()) / 864e5) : null; }
  function fmt(iso) { return iso ? day(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '—'; }
  function fmtT(iso) { return iso ? new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'; }
  function median(a) { if (!a.length) return null; var s = a.slice().sort(function (x, y) { return x - y; }), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; }
  function natural(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true }); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function rows(r) { return Array.isArray(r) ? r : (r && (r.results || r.items || r.data)) || []; }
  function flash(m) { S.toast = m; render(); clearTimeout(flash.t); flash.t = setTimeout(function () { S.toast = ''; render(); }, 3400); }
  function errMsg(e) { return e && (e.status || e.message) || String(e); }

  // ---------------------------------------------------------------- connection
  function flywheelOrigin() {
    try { if (location.ancestorOrigins && location.ancestorOrigins.length) return location.ancestorOrigins[0]; } catch (e) {}
    try { return new URL(document.referrer).origin; } catch (e) { return ''; }
  }
  function connect() {
    if (/demo/.test(location.hash) || /demo=1/.test(location.search)) return startDemo();
    if (!window.Flywheel || !Flywheel.initExtension) { fail('The Flywheel Extension SDK did not load from cdn.flywheel.io.'); return; }
    var timer = setTimeout(function () { if (!S.ext) fail('No connection from Flywheel. Open this page from a project’s Applications menu inside Flywheel, or use demo data.'); }, 8000);
    Flywheel.initExtension({ scope: 'ReadWrite', validateOrigin: function (o) { return /^https:\/\/[a-z0-9.-]+\.flywheel\.io$/.test(o); } })
      .then(function (ext) {
        clearTimeout(timer);
        S.ext = ext; S.user = ext.user || null; S.params = ext.params || {}; S.origin = flywheelOrigin();
        S.opener = ext.container || null;
        if (S.opener && S.opener.container_type === 'project') S.project = S.opener._id;
        note('Connected. Origin ' + (S.origin || 'unknown') + '. User ' + (S.user ? S.user._id : 'unknown') + '. Opened from ' + (S.opener ? S.opener.container_type + ' ' + S.opener._id : 'no container') + '.');
        note('Application options: ' + JSON.stringify(S.params));
        fromHash();
        return load();
      })
      .catch(function (e) { clearTimeout(timer); fail('Could not connect: ' + errMsg(e)); });
  }
  function fail(msg) { S.loading = false; S.error = msg; note('ERROR ' + msg); render(); }
  function api(method, path, params, body) {
    note(method + ' ' + path + (params ? ' ' + JSON.stringify(params) : '') + (body ? ' body ' + JSON.stringify(body).slice(0, 300) : ''));
    var p = S.demo ? DEMO.request(method, path, params, body) : S.ext.apiRequest(method, path, params, body);
    return p.then(function (r) { note('  ok'); return r; }, function (e) { note('  failed: ' + errMsg(e)); throw e; });
  }

  // ---------------------------------------------------------------- loading tasks
  // Task Manager's own column list (known to work on 23.x, from the Reader Shell harness on r6nvg8).
  // Admins are not blinded, so the label columns the reader harness drops are kept here.
  var SAFE = 'task_id,created,status,priority,protocol_label,assignee,parents,due_date,subcategory,parent_details.project_label,parent_details.subject_label,creator,parent_ref';
  var EXTRA = ['transitions', 'read_number', 'adjudication', 'protocol_id', 'protocol_version', 'staffing_pool', 'modified', 'parent_details.session_label'];
  var accepted = null;
  function probe() {
    accepted = [];
    return EXTRA.reduce(function (p, col) {
      return p.then(function () {
        return api('GET', '/api/tasks/reader', { limit: 1, skip: 0, columns: SAFE + ',' + col })
          .then(function () { accepted.push(col); note('  column ' + col + ': accepted'); }, function () { note('  column ' + col + ': rejected'); });
      });
    }, Promise.resolve());
  }
  function load(silent) {
    if (!silent) { S.loading = true; render(); }
    var all = [], seen = {}, LIMIT = 100;
    var attempts = [{ sort: 'created:desc,task_id:asc', extra: true }, { sort: 'created:desc', extra: true }, { sort: 'created:desc', extra: false }], ai = 0;
    function cols() { return SAFE + (attempts[ai].extra && accepted && accepted.length ? ',' + accepted.join(',') : ''); }
    function get(skip) {
      return api('GET', '/api/tasks/reader', { limit: LIMIT, skip: skip, sort: attempts[ai].sort, columns: cols() }).catch(function (e) {
        if (ai === attempts.length - 1 || skip > 0) throw e;
        ai++; note('  retrying with sort=' + attempts[ai].sort + (attempts[ai].extra ? '' : ' and safe columns only'));
        return get(skip);
      });
    }
    function page(skip) {
      return get(skip).then(function (r) {

  }
  function diag() {

  // ---------------------------------------------------------------- events

    all('[data-names]', function (b) { b.onclick = function () { S.showNames = !S.showNames; render(); }; });

    all('[data-reassign-one]', function (b) { b.onclick = function () { var t = S.tasks.filter(function (x) { return (x._id || x.id) === b.getAttribute('data-reassign-one'); })[0]; S.reassign = { from: who(t), to: null, ids: [t._id || t.id] }; render(); }; });

    all('[data-cancel]', function (b) { b.onclick = function () { S.reassign = null; S.exportDlg = null; render(); }; });
    all('[data-export]', function (b) { b.onclick = function () { if (!sc || !sc.first) return; var f = sc.first; S.exportDlg = { protocol: f.protocol_label, protocolId: f.protocol_id, version: f.protocol_version, types: ['form_and_annotation'], columns: REPORT_COLUMNS.slice() }; render(); }; });
    all('[data-rt]', function (b) { b.onclick = function () { var t = b.getAttribute('data-rt'), ts = S.exportDlg.types, k = ts.indexOf(t); if (k > -1) ts.splice(k, 1); else ts.push(t); render(); }; });
    all('[data-run-export]', function (b) { b.onclick = function () { runExport(S.exportDlg); }; });
    all('[data-dl]', function (b) { b.onclick = function () { var r = (S.reports[S.project] || []).filter(function (x) { return (x._id || x.id) === b.getAttribute('data-dl'); })[0]; if (r) download(r); }; });
    all('[data-del-rep]', function (b) { b.onclick = function () { var r = (S.reports[S.project] || []).filter(function (x) { return (x._id || x.id) === b.getAttribute('data-del-rep'); })[0]; if (!r) return; var rid = r._id || r.id; if (S.delPending === rid && Date.now() - S.delAt > 400) { S.delPending = null; deleteReport(r); } else if (S.delPending !== rid) { S.delPending = rid; S.delAt = Date.now(); render(); } }; });
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (S.reassign || S.exportDlg) { S.reassign = null; S.exportDlg = null; } else { S.readerSel = null; S.caseSel = null; } render(); } });
  var lastRefresh = 0;
  function refreshSoon(why) { if ((!S.ext && !S.demo) || S.loading || document.hidden || Date.now() - lastRefresh < 15000) return; lastRefresh = Date.now(); note('Refresh (' + why + ')'); load(true); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshSoon('back on this tab'); });
  setInterval(function () { refreshSoon('every 60 s'); }, 60000);

  // ---------------------------------------------------------------- demo data (shaped like the 23.x responses)
  var DEMO = (function () {
    var seed = 20261029, rnd = function () { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    var hex = function (n) { var s = ''; while (s.length < n) s += Math.floor(rnd() * 16).toString(16); return s; };
    var iso = function (d, h) { var x = new Date(); x.setHours(h == null ? 9 : h, Math.floor(rnd() * 60), 0, 0); x.setDate(x.getDate() + d); return x.toISOString(); };
    var users = [['Priya', 'Raman', 1], ['Marcus', 'Ellery', 1.15], ['Hana', 'Sato', 0.9], ['Daniel', 'Okafor', 0.35], ['Sofia', 'Lindqvist', 1], ['Owen', 'Brandt', 1.5], ['Mei', 'Chen', 1], ['Grace', 'Whitfield', 1.1]].map(function (u) { return { _id: hex(24), firstname: u[0], lastname: u[1], email: (u[0] + '.' + u[1]).toLowerCase() + '@readers.example.com', speed: u[2] }; });
    var me = { _id: hex(24), firstname: 'Data', lastname: 'Manager', email: 'data.manager@example.com' };
    var group = 'reading-ops';
    var projects = [{ _id: hex(24), label: 'TBI-HEM-01', group: group }, { _id: hex(24), label: 'ONC-RECIST-02', group: group }, { _id: hex(24), label: 'Neuro PET', group: group }, { _id: hex(24), label: 'WRC-Pilot', group: group }];
    var roles = [{ _id: 'role-admin', label: 'Read-Write + Task Admin', actions: ['tasks_view', 'tasks_assign', 'tasks_manage'] }, { _id: 'role-reader', label: 'Blinded Reader', actions: ['tasks_view'] }];
    projects.forEach(function (p, i) { p.permissions = [{ _id: me._id, role_ids: [i === 3 ? 'role-reader' : 'role-admin'] }]; });
    var tasks = [], n = 0;
    function mk(proj, proto, protoId, ver, caseIdx, readNo, reader, created, due, status, med, adj) {
      n++;
      var subj = 'Case ' + (1270 + caseIdx), ses = hex(24);
      var t = { _id: hex(24), task_id: 'R-' + (1270 + caseIdx) + '-' + readNo, created: created, status: status, priority: ['medium', 'medium', 'high', 'low'][Math.floor(rnd() * 4)], protocol_label: proto, protocol_id: protoId, protocol_version: ver,
        assignee: reader ? { type: 'user', id: reader._id } : { type: 'staffing_pool', id: 'pool-' + protoId.slice(0, 6) }, parents: { group: group, project: proj._id, subject: hex(24), session: ses }, due_date: due.slice(0, 10), subcategory: adj ? 'adjudication' : 'read',
        parent_details: { project_label: proj.label, subject_label: subj, session_label: 'V1' }, creator: me._id, parent_ref: { type: 'session', id: 'ses-' + proj._id.slice(0, 4) + '-' + caseIdx, label: 'V1' }, read_number: adj ? null : readNo, transitions: { todo: created }, modified: created };
      var c0 = Math.round((Date.parse(created) - Date.now()) / 864e5), spanD = Math.max(1, -c0 - 1);
      if (status === 'in_progress') t.transitions.in_progress = iso(Math.min(0, -Math.floor(rnd() * Math.min(6, spanD))));
      if (status === 'completed') t.transitions.in_progress = iso(Math.min(-1, c0 + 1 + Math.floor(Math.pow(rnd(), 0.8) * spanD)));
      if (status === 'completed') { var m = Math.max(2, Math.round(med * (reader && reader.speed ? reader.speed : 1) * (0.7 + rnd() * 0.6))); t.transitions.completed = new Date(Date.parse(t.transitions.in_progress) + m * 6e4).toISOString(); t.modified = t.transitions.completed; }
      if (adj) t.adjudication = { decision: status === 'completed' ? ['Read 1', 'Read 2', 'Own value'][Math.floor(rnd() * 3)] : null };
      tasks.push(t); return t;
    }
    var tbi = projects[0], onc = projects[1], pidR = hex(24), pidA = hex(24), pidO = hex(24);
    for (var i = 0; i < 40; i++) {
      var batch = Math.floor(i / 10), cr = iso(-34 + batch * 7), due = iso(-34 + batch * 7 + 21), prog = i / 40;
      var a = users[Math.floor(rnd() * 6)], b; do { b = users[Math.floor(rnd() * 6)]; } while (b === a);
      var st = function () { var u = rnd(); return prog < 0.5 ? (u < 0.94 ? 'completed' : 'in_progress') : prog < 0.7 ? (u < 0.45 ? 'completed' : u < 0.75 ? 'in_progress' : 'todo') : (u < 0.08 ? 'in_progress' : 'todo'); };
      var s1 = st(), s2 = st(), r2 = prog > 0.88 && rnd() < 0.6 ? null : b;
      if (!r2) s2 = 'todo';
      mk(tbi, 'Hemorrhage read · CT head', pidR, '3', i, 1, a, cr, due, s1, 19);
      mk(tbi, 'Hemorrhage read · CT head', pidR, '3', i, 2, r2, cr, due, s2, 19);
      var both = s1 === 'completed' && s2 === 'completed', u2 = rnd();
      var adjSt = !both ? 'blocked' : u2 < 0.62 ? 'cancelled' : u2 < 0.8 ? 'completed' : u2 < 0.9 ? 'todo' : u2 < 0.95 ? 'in_progress' : 'blocked';
      mk(tbi, 'Hemorrhage read · CT head', pidR, '3', i, 3, users[6 + (i % 2)], cr, iso(-34 + batch * 7 + 28), adjSt, 11, true);
    }
    for (var j = 0; j < 20; j++) {
      var crO = iso(-30 + Math.floor(j / 8) * 8), dueO = iso(-30 + Math.floor(j / 8) * 8 + 24), pg = j / 20;
      [1, 2].forEach(function (rn) { var u = rnd(), s = pg < 0.4 ? (u < 0.9 ? 'completed' : 'in_progress') : pg < 0.6 ? (u < 0.5 ? 'in_progress' : 'todo') : 'todo'; mk(onc, 'RECIST 1.1 longitudinal read', pidO, '1', j, rn, users[[2, 4, 6, 7, 0][(j + rn) % 5]], crO, dueO, s, 34); });
    }
    for (var k = 0; k < 4; k++) mk(projects[3], 'GA area \u00b7 FAF', hex(24), '1', 900 + k, 1, me, iso(-10), iso(5), k < 2 ? 'completed' : 'todo', 9);
    var reports = [{ _id: hex(24), project_id: tbi._id, protocol_id: pidR, report_type: 'form_and_annotation', status: 'completed', created: iso(-12, 17), size: 146000, origin: { type: 'user', id: me._id } }];
    function csv(pid, type) {
      if (type === 'task_detail') return 'Task ID,Protocol Label,Task Assignee,Task Status,Subject Label,Completed\n' + tasks.filter(function (t) { return t.parents.project === pid; }).slice(0, 80).map(function (t) { var u = users.filter(function (x) { return x._id === (t.assignee || {}).id; })[0]; return [t.task_id, t.protocol_label, u ? u.email : '', t.status, t.parent_details.subject_label, doneAt(t) || ''].join(','); }).join('\n') + '\n';
      var head = 'Task ID,Task Type,Protocol Label,Task Assignee,Task Status,Subject Label,Session Label,Question,Answer\n';
      return head + tasks.filter(function (t) { return t.parents.project === pid && t.status === 'completed' && !t.adjudication; }).slice(0, 60).map(function (t) { var u = users.filter(function (x) { return x._id === t.assignee.id; })[0]; return [t.task_id, 'Read', t.protocol_label, u ? u.email : '', 'Complete', t.parent_details.subject_label, 'V1', 'Hemorrhage present', rnd() < 0.7 ? 'Yes' : 'No'].join(','); }).join('\n') + '\n';
    }
    function ok(v) { return new Promise(function (res) { setTimeout(function () { res(JSON.parse(JSON.stringify(v))); }, 60 + rnd() * 120); }); }
    function no(status) { return new Promise(function (res, rej) { setTimeout(function () { rej({ status: status, message: 'demo ' + status }); }, 80); }); }
    function request(method, path, params, body) {
      var m;
      if (method === 'GET' && path === '/api/tasks/reader') { var sk = (params && params.skip) || 0, lim = (params && params.limit) || 50; return ok({ count: Math.min(lim, tasks.length - sk), total: tasks.length, results: tasks.slice(sk, sk + lim) }); }
      if (method === 'GET' && path === '/api/projects') return ok(projects.map(function (p) { return { _id: p._id, label: p.label, group: p.group }; }));
      if (method === 'GET' && path === '/api/roles') return ok(roles);
      if (method === 'GET' && (m = /^\/api\/projects\/([^/]+)$/.exec(path))) { var pp = projects.filter(function (p) { return p._id === m[1]; })[0]; return pp ? ok(pp) : no(404); }
      if (method === 'GET' && path === '/api/users') return ok(users.concat([me]));
      if (method === 'GET' && path === '/api/reports') { reports.forEach(function (r) { if (r.t0) { var el = Date.now() - r.t0; r.status = el < 2500 ? 'pending' : el < 6000 ? 'in_progress' : 'completed'; if (r.status === 'completed') { r.size = r.report_type === 'task_detail' ? 38000 : 146000; delete r.t0; } } }); return ok({ count: reports.length, total: reports.length, results: reports.filter(function (r) { return !params || !params.project_id || r.project_id === params.project_id; }) }); }
      if (method === 'PUT' && (m = /^\/api\/tasks\/reader\/([^/]+)\/assign$/.exec(path))) { var t = tasks.filter(function (x) { return x._id === m[1]; })[0]; if (!t) return no(404); t.assignee = body.assignee; return ok({ modified: 1 }); }
      if (method === 'POST' && (m = /^\/api\/(form_and_annotation|task_detail)\/reports$/.exec(path))) { var nr = { _id: hex(24), project_id: body.project_id, protocol_id: body.protocol_id, report_type: m[1], status: 'pending', created: new Date().toISOString(), origin: { type: 'user', id: me._id }, t0: Date.now() }; reports.unshift(nr); return ok(nr); }
      if (method === 'GET' && (m = /^\/api\/(form_and_annotation|task_detail)\/reports\/([^/]+)\/csv$/.exec(path))) { var rr = reports.filter(function (r) { return r._id === m[2]; })[0]; return rr ? ok(csv(rr.project_id, m[1])) : no(404); }
      if (method === 'DELETE' && (m = /^\/api\/(form_and_annotation|task_detail)\/reports\/([^/]+)$/.exec(path))) { reports = reports.filter(function (r) { return r._id !== m[2]; }); return ok({ deleted: 1 }); }
      return no(404);
    }
    return { request: request, me: me };
  })();
  function startDemo() {
    S.demo = true; S.error = null; S.user = DEMO.me; S.origin = ''; S.params = {};
    note('Demo mode: mock data shaped like the 23.x API. No network calls to Flywheel.');
    fromHash(); load();
  }
  connect();
})();
