  --ease-pop:cubic-bezier(0.16,1,0.3,1);/* @kind other */--duration-pop:400ms;/* @kind other */    /* menus/popovers slide+fade */
  --ease-collapse:cubic-bezier(0.87,0,0.13,1);/* @kind other */--duration-collapse:300ms;/* @kind other */
  --ease-progress:cubic-bezier(0.65,0,0.35,1);/* @kind other */--duration-progress:660ms;/* @kind other */
  --opacity-disabled:0.4;/* @kind other */
  --grid-columns:12;/* @kind other */ /* from tokens/spacing.css */
  --overlay:var(--separations-overlay);
}

/* ---- element defaults (lib/index.css) ---- */
/* Element defaults mirrored from lib/index.css */
:root{scrollbar-color:var(--typography-light) var(--slate-hover)}
body{margin:0;font-family:var(--font-sans);font-size:var(--text-base);line-height:var(--lh-base);font-weight:400;color:var(--typography-base);background:var(--page-light)}
svg{pointer-events:none}
a{text-decoration:underline;color:var(--primary-base);cursor:pointer}
a:hover{text-decoration:none}
a:active{text-decoration:none;outline:2px solid var(--primary-dark);border-radius:4px}
a:visited{color:var(--secondary-base)}
p{margin:0;color:var(--typography-muted);font-size:var(--text-p2);line-height:var(--lh-p2)}
h1,h2,h3,h4,h5,h6{margin:0;color:var(--typography-base);font-weight:500}
h1{font-size:var(--text-h1);line-height:var(--lh-h1)}
h2{font-size:var(--text-h2);line-height:var(--lh-h2)}
h3{font-size:var(--text-h3);line-height:var(--lh-h3)}
h4{font-size:var(--text-h4);line-height:var(--lh-h4)}
h5{font-size:var(--text-h5);line-height:var(--lh-h5)}
h6{font-size:var(--text-h6);line-height:var(--lh-h6)}
.text-overlay{font-size:var(--text-overlay);line-height:var(--lh-overlay);font-weight:500;text-shadow:var(--shadow-overlay-text)}
[class^="icon-"],[class*=" icon-"]{font-size:24px;line-height:1;display:inline-block}

/* ---- Flywheel-Vision-Icons glyph classes (IcoMoon) ---- */
[class^="icon-"], [class*=" icon-"] {
  /* use !important to prevent issues with browser extensions that change fonts */
  font-family: 'Flywheel-Vision-Icons' !important;
  speak: never;
  font-style: normal;
  font-weight: normal;
  font-variant: normal;
  text-transform: none;
  line-height: 1;
  
  /* Enable Ligatures ================ */
  letter-spacing: 0;
  -webkit-font-feature-settings: "liga";
  -moz-font-feature-settings: "liga=1";
  -moz-font-feature-settings: "liga";
  -ms-font-feature-settings: "liga" 1;
  font-feature-settings: "liga";
  -webkit-font-variant-ligatures: discretionary-ligatures;
  font-variant-ligatures: discretionary-ligatures;

  /* Better Font Rendering =========== */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ---- fix: ToolbarComboButton overflow chevron ----
   The ported Popover wraps its trigger in a position:relative span, so the absolutely positioned
   .fw-toolbar-combo-more chevron was placed beside the 50px button instead of on its edge
   (the source uses Radix, which adds no wrapper). Let the wrapper cover the combo box and pass
   pointer events through to the button beneath it; only the chevron and the open list stay clickable. */

.fw-toolbar-combo > .fw-popover-wrap > span { display: contents; }

/* ---- ToolbarComboButton menu control (Figma Viewer-3.0 · Menu Control, 104472-110998) ----
   The side trigger is a 10×40 strip centred on the 50px button, not a full-height 10×50 one. At rest the
   16px chevron sits 2px toward the button; on hover it slides to centre (50ms) over a vertical gradient
   that peaks at the middle, with a hairline on the button side. A selected (Focused) button uses the
   denser gradient. Chevron ink: typography-light at rest, typography-base on hover; sidebar-base (fixed navy) on a selected button. */

.fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-more-right .fw-icon { transition: transform 50ms ease-out; color: var(--typography-light); }
.fw-toolbar-combo-more-left .fw-icon { transform: translateX(2px); }
.fw-toolbar-combo-more-right .fw-icon { transform: translateX(-2px); }
.fw-toolbar-combo-more-left:hover .fw-icon, .fw-toolbar-combo-more-right:hover .fw-icon { transform: translateX(0); color: var(--typography-base); }
.fw-toolbar-combo-more-left:hover, .fw-toolbar-combo-more-right:hover {

.fw-toolbar-combo-selected .fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right .fw-icon,

/* ---- Chip sizing (Figma Vision Design System · Chips, 4964-73403) ----
   Chip/Outlined is a fixed 24px: 1px border, 4px container padding, 16px icon/avatar/close, text 12px at
   line-height 1.2 with 6px side padding; the count beside the title is regular weight in typography-light
   (white at 60% on a filled chip). The port's 140% line-height + 16px min-height made the chip ~23px and the
   text sit low; compact keeps its 14px inner cap. */
.fw-chip { height: 24px; }
.fw-chip .fw-chip-inner { padding: 0 4px; height: 100%; box-sizing: border-box; gap: 0; }

.fw-chip-on .fw-chip-text span { color: inherit; opacity: .6; }
.fw-chip-compact { height: auto; }
.fw-chip-compact .fw-chip-inner { max-height: 14px; padding: 2px; }

.attn .fw-menu-item{height:auto;min-height:48px;padding-top:6px;padding-bottom:6px}
.stagebar{display:flex;height:28px;border-radius:6px;overflow:hidden;background:var(--slate-hover)}
.stagebar .fw-tooltip-wrap{display:contents}
.seg{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--typography-contrast);min-width:0}
.tscroll{overflow-x:auto;width:100%}
.tscroll>.fw-table{min-width:760px}
.flow{display:flex;align-items:stretch;min-width:900px}
.flow .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.col-h{display:flex;align-items:center;gap:8px;height:24px}
.flow .arr{width:32px;flex:none;display:flex;align-items:center;justify-content:center}
.stage{display:flex;flex-direction:column;gap:4px;width:100%;padding:12px;border-radius:8px;border:1px solid var(--separations-border);background:var(--card-background);color:var(--typography-base);text-align:left;font:inherit;cursor:pointer}
.stage:hover{background:var(--primary-hover)}
.stage:focus-visible{outline:2px solid var(--primary-base);outline-offset:2px}
.stage[aria-pressed="true"]{border-color:var(--primary-base);background:var(--primary-hover)}
.stage-h{display:flex;align-items:center;gap:8px;width:100%}
.stage-n{font-size:20px;font-weight:500}
.lines{display:flex;flex-direction:column;gap:2px}
.link{color:var(--primary-base);font-weight:500}
.wl{min-width:760px;display:flex;flex-direction:column;gap:2px}
.wl-row{display:grid;grid-template-columns:200px 1fr 1.25fr;gap:16px;align-items:center;min-height:38px}
.wl-head{min-height:24px}
.wl-name{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:2px 4px;margin-left:-4px;border-radius:6px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.wl-name:hover{background:var(--primary-hover)}
.wl-name:focus-visible{outline:2px solid var(--primary-base)}
.wl-bar{display:flex;align-items:center;gap:8px}
.wl-n{font-size:12px;width:48px;text-align:right}
.bar{flex:1;display:flex;height:10px;border-radius:4px;overflow:hidden;background:transparent}
.strip{position:relative;height:22px}
.strip .band{position:absolute;top:2px;bottom:2px;background:var(--primary-hover);border-radius:4px}
.strip .ax{position:absolute;top:11px;left:0;right:0;border-top:1px solid var(--separations-base)}
.strip i{position:absolute;top:7px;width:9px;height:9px;margin-left:-4px;border-radius:50%;opacity:.9}
.strip b{position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;background:var(--typography-base);border-radius:1px}
.rep-st{display:flex;align-items:center;gap:10px}
.fresh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--separations-base);font-size:12px;color:var(--typography-base)}
.kv>:first-child{color:var(--typography-muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.sw-l{display:inline-flex;align-items:center;gap:8px}
.cand .fw-cr{width:100%;max-width:none}
.cand .fw-cr-group{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
pre.log{margin:0;white-space:pre-wrap;word-break:break-word;font:11px/1.55 var(--font-sans);color:var(--typography-muted);max-height:420px;overflow:auto}
.overlay{position:fixed;inset:0;background:var(--separations-overlay);z-index:900}
.side{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:100%;z-index:901;display:flex;box-shadow:var(--shadow-extra-large)}
.side>.fw-panel{height:100%}
.side-h{display:flex;flex-direction:column;min-width:0}
.ghost-rail{width:252px;flex:none;padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:var(--card-header);border-right:1px solid var(--separations-base)}
@media (max-width:760px){.tb-r .fw-tag,.crumb-proj,.crumb-sep{display:none}.topbar{height:auto!important;min-height:50px;flex-wrap:wrap!important;padding:8px 12px!important}.content{padding:12px}.side{width:100%}}
</style>
</head>

              badge=${pr.od ? html`<${Tooltip} title=${plural(pr.od, 'overdue read')} position="right"><${Badge} value=${String(pr.od)} color="red" variant="static" /></${Tooltip}>` : null}

  function TopBar(p) {
    var f = p.sc.first || {};
    return html`<${GroupLayout} padded=${false} className="topbar">
      <div class="tb-l">
        <${Typography} variant="h3" color="light" className="crumb-proj" style=${NOWRAP}>${projLabel(S.project)}</${Typography}>
        <span class="crumb-sep">/</span>
        <${Typography} variant="h3" overflow>${f.protocol_label || 'Unlabelled protocol'}</${Typography}>
        ${f.protocol_version ? html`<${Tag} color="slate" title=${'v' + f.protocol_version} />` : null}
      </div>
      <div class="tb-r">
        ${S.demo ? html`<${Tag} color="orange" icon="information-circle" title="Demo Data" />`
          : html`<${Tooltip} title=${'Connected to ' + host()} position="bottom"><${Tag} color="green" icon="done-check" title=${'Live' + (S.updated ? ' · ' + S.updated.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '')} /></${Tooltip}>`}
        <${Tooltip} title="Refresh" position="bottom"><${IconButton} icon="rotate-refresh" size="small" color="slate" aria-label="Refresh" onClick=${function () { load(); loadExports(); }} /></${Tooltip}>
        <${Tooltip} title=${S.showNames ? 'Code reader names' : 'Show reader names'} position="bottom"><${IconButton} icon="visible-eye-hidden" size="small" color="slate" selected=${!S.showNames} aria-label="Code reader names" onClick=${function () { set({ showNames: !S.showNames }); }} /></${Tooltip}>
        <${Tooltip} title=${S.dark ? 'Light mode' : 'Dark mode'} position="bottom"><${IconButton} icon="moon-night-mode" size="small" color="slate" selected=${S.dark} aria-label="Dark mode" onClick=${toggleDark} /></${Tooltip}>
        <${Button} size="small" startIcon="document-file-download" disabled=${!f.protocol_id} onClick=${function () { openExport(p.sc); }}>Export Report</${Button}>
      </div>
    </${GroupLayout}>`;
  }

  function ViewTabs(p) {
    var nn = p.cs.filter(function (c) { return c.stg === 'compare'; }).length, ex = (S.reports[S.project] || []).filter(active).length;
    var label = function (t, n) { return n ? html`<span class="tab-l">${t}<${Badge} value=${String(n)} color="orange" variant="static" /></span>` : t; };
    var tabs = [['overview', 'Overview'], p.hasWf ? ['workflow', 'Workflow', nn] : null, ['readers', 'Readers'], ['cases', 'Cases'], ['exports', 'Exports', ex], ['diagnostics', 'Diagnostics']].filter(Boolean);
    return html`<div class="tabbar"><${Tabs} value=${S.screen} onChange=${go}>${tabs.map(function (t) { return html`<${Tab} key=${t[0]} value=${t[0]} title=${label(t[1], t[2])} />`; })}</${Tabs}></div>`;
  }

  // ---------------------------------------------------------------- overview
  function OverviewView(p) {
    var sc = p.sc, ts = sc.tasks, c = counts(ts), tot = ts.length, done = c.completed;
    var mins = ts.map(minutesOf).filter(function (x) { return x != null; }), med = median(mins);
    var since14 = Date.now() - 14 * 864e5, recent = ts.filter(function (t) { var d = doneAt(t); return d && Date.parse(d) >= since14; }).length, rate = recent / 14;
    var dues = ts.map(function (t) { return t.due_date; }).filter(Boolean).sort(), target = dues.length ? days(dues[dues.length - 1]) : null;
    var remain = tot - done - c.cancelled, proj = remain <= 0 ? 0 : (recent >= 4 ? Math.ceil(remain / rate) : null);
    var late = proj != null && target != null ? proj - target : null;
    var dl = function (d) { var x = today0(); x.setDate(x.getDate() + d); return x.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
    var keys = ['completed', 'in_progress', 'todo', 'overdue', 'unassigned', 'blocked'];
    return html`<${Frag}>
      <div class="kpis">
        <${Kpi} label="Reads Complete" value=${tot ? Math.round(done / tot * 100) + '%' : '—'} sub=${done + ' of ' + tot + ' tasks'} />
        <${Kpi} label="Open" value=${String(c.in_progress + c.todo + c.overdue + c.unassigned)} sub=${c.in_progress + ' in progress · ' + c.unassigned + ' in pool'} />
        <${Kpi} label="Overdue" value=${String(c.overdue)} sub=${c.overdue ? 'past task due date' : 'none past due'} tone=${c.overdue ? 'red' : null} />
        <${Kpi} label="Median Read Time" value=${med == null ? '—' : Math.round(med) + ' min'} sub=${mins.length ? 'from ' + plural(mins.length, 'timed read') : 'needs transitions column'} />
        <${Kpi} label="Pace, Last 14 Days" value=${rate ? rate.toFixed(1) + '/day' : '—'} sub=${plural(recent, 'read') + ' completed'} />
        <${Kpi} label="Projected Finish" value=${proj == null ? '—' : remain <= 0 ? 'Done' : dl(proj)} tone=${late > 0 ? 'orange' : null}
          sub=${late == null ? (target == null ? 'no due dates set' : 'not enough recent reads') : late > 0 ? late + ' days after last due date' : 'on track for ' + dl(target)} />
      </div>
      <div class="row">
        <${Panel} title="Status" style=${{ flex: '1 1 260px' }}>
          <div class="donut-wrap">
            <div class="donut" role="img" aria-label=${keys.map(function (k) { return c[k] + ' ' + LABEL[k]; }).join(', ')} style=${{ background: donutBg(c, keys) }}>
              <div><span class="num" style=${{ fontSize: 22, fontWeight: 500 }}>${tot}</span><${Typography} variant="p4" color="light">tasks</${Typography}></div>
            </div>
            <div class="donut-list">${keys.filter(function (k) { return c[k] || k !== 'blocked'; }).map(function (k) {
              return html`<div key=${k} class="dl-row"><i class="sw" style=${{ background: COL[k] }}></i><${Typography} variant="p3" color="muted" display="grow">${LABEL[k]}</${Typography}><b class="num">${c[k]}</b></div>`;
            })}</div>
          </div>
        </${Panel}>
        <${Burnup} ts=${ts} tot=${tot} rate=${rate} proj=${proj} target=${target} />
        <${Attention} sc=${sc} cs=${p.cs} />
      </div>
    </${Frag}>`;
  }

  function Burnup(p) {
    var ts = p.ts, tot = p.tot, rate = p.rate, proj = p.proj, target = p.target;
    var created = ts.map(function (t) { return t.created; }).filter(Boolean).sort();
    if (!created.length) return null;
    var start = Math.min(0, Math.round((day(created[0]) - today0()) / 864e5)), end = Math.max(0, target || 0, proj && proj < 120 ? proj : 0) + 2, span = Math.max(1, end - start);
    var X = function (d) { return ((d - start) / span * 1000).toFixed(1); }, Y = function (v) { return (200 - (tot ? v / tot : 0) * 190).toFixed(1); };
    var doneDays = ts.map(doneAt).filter(Boolean).map(function (d) { return Math.round((day(d) - today0()) / 864e5); });
    var pts = []; for (var d = start; d <= 0; d++) { var n = doneDays.filter(function (x) { return x <= d; }).length; pts.push(X(d) + ' ' + Y(n)); }
    var cur = doneDays.length, path = 'M ' + pts.join(' L ');
    var plan = target != null ? 'M ' + X(start) + ' ' + Y(0) + ' L ' + X(target) + ' ' + Y(tot) : '';
    var pj = proj != null && proj > 0 && proj < 120 ? 'M ' + X(0) + ' ' + Y(cur) + ' L ' + X(proj) + ' ' + Y(tot) : '';
    var pct = function (d) { return Math.max(0, Math.min(100, (d - start) / span * 100)); };
    var msg = proj == null ? 'Not enough completed reads in the last 14 days to project a finish date.' : proj === 0 ? 'All reads complete.'
      : 'At ' + rate.toFixed(1) + ' reads/day, the remaining reads finish in about ' + plural(proj, 'day') + (target != null ? (proj > target ? ', ' + (proj - target) + ' days after the last due date.' : ', before the last due date.') : '.');
    return html`<${Panel} title="Throughput vs Plan" style=${{ flex: '3 1 440px' }}>
      <div class="legend" style=${{ marginBottom: 12 }}><span><i class="sw" style=${{ height: 3, background: 'var(--primary-base)' }}></i>Completed</span><span><i class="sw ln dash"></i>Plan to last due date</span><span><i class="sw ln dot"></i>14-day pace</span></div>
      <div class="chart">
        <span class="num ax-l" style=${{ top: -6 }}>${tot}</span><span class="num ax-l" style=${{ bottom: -6 }}>0</span>
        <div class="today" style=${{ left: pct(0) + '%' }}></div>
        <svg viewBox="0 0 1000 200" preserveAspectRatio="none" role="img" aria-label=${cur + ' of ' + tot + ' completed'}>
          ${plan ? html`<path d=${plan} style=${{ fill: 'none', stroke: 'var(--typography-light)', strokeWidth: 2, strokeDasharray: '6 6' }} vector-effect="non-scaling-stroke" />` : null}
          ${pj ? html`<path d=${pj} style=${{ fill: 'none', stroke: 'var(--orange-base)', strokeWidth: 2, strokeDasharray: '2 5' }} vector-effect="non-scaling-stroke" />` : null}
          <path d=${path + ' L ' + X(0) + ' 200 L ' + X(start) + ' 200 Z'} style=${{ fill: 'var(--primary-focus)' }} />
          <path d=${path} style=${{ fill: 'none', stroke: 'var(--primary-base)', strokeWidth: 2.5 }} vector-effect="non-scaling-stroke" />
        </svg>
      </div>

  function Attention(p) {
    var sc = p.sc, cs = p.cs, st = readerStats(sc.tasks), items = [];
    st.filter(function (r) { return r.od; }).sort(function (a, b) { return b.od - a.od; }).slice(0, 3).forEach(function (r) { items.push(['red', 'Overdue', userName(r.id) + ' · ' + plural(r.od, 'overdue read'), r.ip + ' in progress, ' + r.ns + ' not started', function () { openReader(r.id); }, 'warning-circle']); });
    var allMins = [].concat.apply([], st.map(function (r) { return r.mins; })), med = median(allMins), floor = (S.params.pace_floor_minutes) || (med ? Math.max(2, Math.round(med * 0.4)) : null);
    if (floor) st.filter(function (r) { return r.mins.length >= 3 && r.med < floor; }).forEach(function (r) { items.push(['orange', 'Pace', userName(r.id) + ' · median ' + Math.round(r.med) + ' min', 'Protocol median ' + Math.round(med) + ' min; flagged under ' + floor + ' min', function () { openReader(r.id); }, 'timer-clock-style']); });

      ${items.length ? html`<div class="attn">${items.map(function (i, k) {

  // ---------------------------------------------------------------- workflow
  function WorkflowView(p) {
    var cs = p.cs;
    var G = { all: null, await: ['await'], partial: ['partial'], both: ['compare', 'adj', 'finalC', 'finalA'], compare: ['compare'], adj: ['adj'], final: ['finalC', 'finalA'], finalC: ['finalC'], finalA: ['finalA'] };
    var of = function (g) { return cs.filter(function (c) { return !G[g] || G[g].indexOf(c.stg) > -1; }); };

      var age = !xs.length ? 'None' : fin ? 'Median ' + dmed(xs.map(function (x) { return x.fin && x.rel ? (Date.parse(x.fin) - Date.parse(x.rel)) / 864e5 : null; }).filter(function (x) { return x != null; })) + ' from first read created' : 'Oldest ' + mx + ' d in stage · median ' + dmed(ds);

        <${Typography} variant="p4" color="muted">${sub}</${Typography}>
        <${Typography} variant="p4" style=${{ color: hot ? 'var(--orange-base)' : 'var(--typography-light)' }}>${age}</${Typography}>
      </button>`;
    };
    var aw = []; of('await').forEach(function (c) { aw = aw.concat(c.reads); }); var ac = counts(aw);
    var bothN = of('both').length, adjN = of('finalA').length + of('adj').length + of('compare').length;
    var thr = S.params.stage_warn_days || {};
    var cols = [
      ['1', 'Independent Reads', [card('await', 'Awaiting Reads', SC.await, ac.unassigned + ' in pool · ' + (ac.todo + ac.overdue) + ' not started · ' + ac.in_progress + ' in progress', thr.await || 14), card('partial', 'Some Reads In', SC.partial, 'At least one read submitted', thr.partial || 5)]],
      ['2', 'Comparison', [card('both', 'All Reads In', 'var(--slate-base)', adjN + ' went to adjudication (' + (bothN ? Math.round(adjN / bothN * 100) : 0) + '%)'), card('compare', 'Waiting on Comparison', SC.compare, 'Reads in, adjudication task still blocked', thr.compare || 1)]],
      ['3', 'Adjudication', [card('adj', 'Adjudicating', SC.adj, 'Adjudication task open', thr.adj || 7)]],
      ['4', 'Final', [card('final', 'Final', SC.finalC, of('final').length + ' of ' + cs.length + ' cases'), card('finalC', 'No Adjudication Needed', SC.finalC, 'Reads agreed, or no adjudication task'), card('finalA', 'Adjudicated', SC.finalA, 'Adjudication task complete')]]
    ];

    var gaps = cs.filter(function (c) { return c.reads.length >= 2 && c.done === c.reads.length; }).map(function (c) { var d = c.reads.map(doneAt).filter(Boolean).map(Date.parse).sort(); return d.length >= 2 ? (d[d.length - 1] - d[0]) / 864e5 : null; }).filter(function (x) { return x != null; });
    var tat = cs.filter(function (c) { return c.stg === 'finalA' && c.adj.transitions && c.adj.transitions.completed; }).map(function (c) { var s = c.adj.transitions.todo || c.adj.transitions.in_progress || c.adj.created; return s ? (Date.parse(c.adj.transitions.completed) - Date.parse(s)) / 864e5 : null; }).filter(function (x) { return x != null; });
    var list = of(S.wfStage).sort(function (a, b) { return order.indexOf(a.stg) - order.indexOf(b.stg) || (b.days || 0) - (a.days || 0); });
    var columns = [
      { key: 'label', header: 'Case', render: function (c) { return html`<${Link}>${c.label}</${Link}>`; } },
      { key: 'stg', header: 'Stage', noWrap: true, render: function (c) { return html`<${Tag} color=${SHUE[c.stg]} title=${SL[c.stg]} />`; } },
      { key: 'days', header: 'Days in Stage', align: 'right', render: function (c) { return html`<span class="num">${c.fin ? '—' : c.days == null ? '—' : c.days + ' d'}</span>`; } },
      { key: 'reads', header: 'Reads', render: function (c) { return html`<div class="lines">${c.reads.map(function (t) { return html`<div key=${t._id}>${userName(who(t))} <span class="muted">· ${LABEL[stOf(t)].toLowerCase()}</span></div>`; })}</div>`; } },
      { key: 'adj', header: 'Adjudication', render: function (c) { return c.adj ? html`<div class="fw-cell-div">${c.adj.task_id}<${StatusTag} k=${stOf(c.adj)} />${c.adj.adjudication && c.adj.adjudication.decision ? html`<span class="muted">${c.adj.adjudication.decision}</span>` : null}</div>` : html`<span class="muted">—</span>`; } }

  // ---------------------------------------------------------------- readers

      </${Panel}>
      <${Panel} padded=${false} title="Task Report Queue" aside=${html`<${Typography} variant="p3" color="light" overflow>Newest first · same queue as the project’s Task Report Queue tab</${Typography}>`}>
        ${all == null ? html`<div style=${{ padding: 16, display: 'flex', flexDirection: 'column', gap: 12 }}>${[0, 1, 2].map(function (i) { return html`<${Ghost} key=${i} variant="text" height=${16} />`; })}</div>`
          : html`<${Scroll}><${Table} columns=${columns} rows=${mine} rowKey="_id" emptyText="No reports yet." /></${Scroll}>`}
      </${Panel}>
    </${Frag}>`;
  }

  // ---------------------------------------------------------------- diagnostics
  function DiagView() {
    return html`<${Frag}>
      <${Panel} title="Calls Made" aside=${html`<${Typography} variant="p3" color="light" overflow>Columns accepted: ${accepted ? accepted.join(', ') || '(none)' : '(not probed)'}</${Typography}>`}>
        <pre class="log">${'Route: ' + (location.hash || '#/overview') + '\n\n' + S.log.join('\n')}</pre>
      </${Panel}>
      ${S.tasks[0] ? html`<${Panel} title="One Raw Task"><${Json} sourceObject=${S.tasks[0]} /></${Panel}>` : null}
    </${Frag}>`;
  }

  // ---------------------------------------------------------------- side panels
  function SidePanel(p) {
    return html`<${Frag}>
      <div class="overlay" onClick=${closeSide}></div>
      <aside class="side" aria-label=${p.title}>
        <${PanelLayout} border="left" rounded=${false} header=${html`<${Frag}><div class="side-h"><${Typography} variant="p4" color="light">${projLabel(S.project)}</${Typography}><${Typography} variant="h3" overflow>${p.title}</${Typography}></div><${IconButton} icon="close" size="small" color="slate" aria-label="Close" onClick=${closeSide} /></${Frag}>`}
          footer=${p.footer || null}>${p.children}</${PanelLayout}>
      </aside>
    </${Frag}>`;
  }
  function ReaderPanel(p) {
    var sc = p.sc, id = S.readerSel, st = readerStats(sc.tasks).filter(function (r) { return r.id === id; })[0];
    if (!st) return html`<${SidePanel} title=${userName(id)}><${ContextLayout} size="compact" icon="user" iconColor="slate" title="No Tasks on This Protocol" /></${SidePanel}>`;
    var keys = ['completed', 'in_progress', 'todo', 'overdue'];
    var movable = st.tasks.filter(function (t) { return t.status === 'todo'; });
    var columns = [
      { key: 'task_id', header: 'Task', noWrap: true },
      { key: 'case', header: 'Case', render: function (t) { return html`<${Link}>${caseLabel(t)}</${Link}>`; } },
      { key: 'm', header: 'Time', align: 'right', render: function (t) { var m = minutesOf(t); return m ? m + ' min' : '—'; } },
      { key: 'due', header: 'Due', noWrap: true, render: function (t) { return fmt(t.due_date); } },
      { key: 'st', header: 'Status', render: function (t) { return html`<${StatusTag} k=${stOf(t)} />`; } }
    ];
    return html`<${SidePanel} title=${userName(id)}
      footer=${html`<${Button} size="small" startIcon="user-group" disabled=${!movable.length} onClick=${function () { startReassign(id, movable.map(function (t) { return t._id || t.id; })); }}>${'Reassign ' + plural(movable.length, 'Not-Started Read')}</${Button}>`}>
      <div class="donut-wrap">
        <div class="donut sm" style=${{ background: donutBg(st.c, keys) }}><div><span class="num" style=${{ fontSize: 20, fontWeight: 500 }}>${st.assigned}</span></div></div>
        <div style=${{ flex: 1 }}>${keys.map(function (k) { return html`<${Kv} key=${k} k=${html`<span class="sw-l"><i class="sw" style=${{ background: COL[k] }}></i>${LABEL[k]}</span>`}><b class="num">${st.c[k]}</b></${Kv}>`; })}</div>
      </div>
      <div style=${{ margin: '12px 0 16px' }}>
        <${Kv} k="Median read time">${st.med == null ? '—' : Math.round(st.med) + ' min'}</${Kv}>
        <${Kv} k="Last activity">${st.last ? fmtT(st.last) : '—'}</${Kv}>
        <${Kv} k="Email">${S.showNames ? (S.users[id] || {}).email || '—' : 'Hidden while names are coded'}</${Kv}>
      </div>
      <${PanelLayout} border="all" padded=${false} height="auto">
        <${Table} dense columns=${columns} rows=${st.tasks.slice().sort(function (a, b) { return natural(a.task_id, b.task_id); })} rowKey="_id" onRowClick=${function (t) { openCase(caseKey(t)); }} />
      </${PanelLayout}>
    </${SidePanel}>`;
  }
  function viewerUrl(t) { var pid = projOf(t); return pid && S.origin ? S.origin + '/ohif-viewer-v3/project/' + pid + '/reader?taskId=' + encodeURIComponent(t._id || t.id) : null; }
  function CasePanel(p) {
    var c = p.cs.filter(function (x) { return x.key === S.caseSel; })[0];
    if (!c) return html`<${SidePanel} title="Case"><${ContextLayout} size="compact" icon="folder-open" iconColor="slate" title="Not in This Protocol" description="This case isn’t in the selected protocol." /></${SidePanel}>`;
    var tl = c.reads.concat(c.adj ? [c.adj] : []);
    return html`<${SidePanel} title=${c.label}>
      <div style=${{ marginBottom: 16 }}><${Tag} size="large" color=${SHUE[c.stg]} title=${SL[c.stg]} /></div>
      <div class="stack">${tl.map(function (t) {
        var m = minutesOf(t), u = viewerUrl(t), tid = t._id || t.id;
        return html`<${PanelLayout} key=${tid} border="all" height="auto" header=${html`<${Frag}><${Typography} variant="h4">${t.task_id}</${Typography}><${StatusTag} k=${stOf(t)} /></${Frag}>`}
          footer=${(u || t.status === 'todo' || t.status === 'blocked') ? html`<${Frag}>
            ${t.status === 'todo' || t.status === 'blocked' ? html`<${Button} size="small" variant="outlined" color="slate" startIcon="user-group" onClick=${function () { startReassign(who(t), [tid]); }}>Reassign</${Button}>` : null}
            ${u ? html`<${Button} size="small" variant="outlined" startIcon="eye-modern-square-read" onClick=${function () { note('open viewer ' + u); window.open(u, '_blank', 'noopener'); }}>Open in Viewer</${Button}>` : null}
          </${Frag}>` : null}>
          <${Kv} k=${isAdj(t) ? 'Adjudication' : 'Read ' + (t.read_number || '')}>${userName(who(t))}</${Kv}>
          <${Kv} k="Due">${fmt(t.due_date)}</${Kv}>
          <${Kv} k="Read time">${m ? m + ' min' : '—'}</${Kv}>
          ${t.adjudication && t.adjudication.decision ? html`<${Kv} k="Decision">${t.adjudication.decision}</${Kv}>` : null}
        </${PanelLayout}>`;
      })}</div>
      <div style=${{ marginTop: 16 }}><${Typography} variant="p3" color="light">Answers by read (and agreement) need form responses per task; they arrive with the next harness step.</${Typography}></div>
      ${S.demo ? html`<div style=${{ marginTop: 8 }}><${Typography} variant="p4" color="light">Open in Viewer needs the Flywheel origin, so it is hidden in demo mode.</${Typography}></div>` : null}
    </${SidePanel}>`;
  }

  // ---------------------------------------------------------------- dialogs
  function closeDialogs() { set({ reassign: null, exportDlg: null, delConfirm: null }); }
  function ReassignDialog(p) {
    var r = S.reassign, ts = S.tasks.filter(function (t) { return r.ids.indexOf(t._id || t.id) > -1; });
    var cands = readerStats(p.sc.all).filter(function (x) { return x.id !== r.from; }).sort(function (a, b) { return a.open - b.open; });
    if (S.user && !cands.some(function (x) { return x.id === S.user._id; }) && S.user._id !== r.from) cands.push({ id: S.user._id, open: 0, med: null });
    return html`<${Dialog} open title=${'Reassign ' + plural(ts.length, 'Read')} icon="user-group" onClose=${closeDialogs}
      description=${ts.map(function (t) { return t.task_id; }).slice(0, 8).join(', ') + (ts.length > 8 ? '…' : '') + (r.from ? ' from ' + userName(r.from) : '')}
      actions=${html`<${Frag}><${Button} size="small" variant="outlined" color="slate" onClick=${closeDialogs}>Cancel</${Button}>
        <${Button} size="small" disabled=${!r.to || S.busy} onClick=${function () { reassign(ts, r.to); }}>${'Move ' + plural(ts.length, 'Read')}</${Button}></${Frag}>`}>
      <${WrappedInput} title="Move To">
        <div class="cand"><${ContainedRadioGroup} name="reassign-to" value=${r.to || undefined} onChange=${function (v) { r.to = v; render(); }}>
          ${cands.map(function (x) { return html`<${ContainedRadio} key=${x.id} value=${x.id} size="compact" title=${userName(x.id)} description=${x.open + ' open in this project'} />`; })}
        </${ContainedRadioGroup}></div>
      </${WrappedInput}>
      <div style=${{ marginTop: 12 }}><${Typography} variant="p3" color="light">Only not-started reads move, so nobody loses a draft. This changes the assignee in Flywheel and shows in the task’s history.</${Typography}></div>
    </${Dialog}>`;
  }
  function ExportDialog() {
    var d = S.exportDlg, bad = !d.types.length || !d.protocolId;
    var req = d.types.map(function (t) { return 'POST /api/' + t + '/reports\n' + JSON.stringify({ protocol_id: d.protocolId, project_id: S.project, version: d.version, metadata_columns: d.columns }, null, 2); }).join('\n\n');
    return html`<${Dialog} open title="New Task Report" icon="document-file-add-plus-bottom-left" onClose=${closeDialogs}
      description="Queued in the platform’s Task Report Queue; Flywheel builds the CSV and keeps it on the project."
      actions=${html`<${Frag}><${Button} size="small" variant="outlined" color="slate" onClick=${closeDialogs}>Cancel</${Button}>
        <${Button} size="small" disabled=${bad || S.busy} onClick=${function () { runExport(d); }}>${'Queue ' + (d.types.length > 1 ? d.types.length + ' Reports' : 'Report')}</${Button}></${Frag}>`}>
      <div class="stack">
        <${WrappedInput} title="Protocol"><${TextInput} size="small" fullWidth readOnly value=${d.protocol + (d.version ? ' · v' + d.version : '')} /></${WrappedInput}>
        <${WrappedInput} title="Report" description="Forms and annotations: every form response and annotation on this protocol’s tasks. Task details: one row per task with status, assignee and timestamps. Pick both to queue two reports.">
          <${ButtonGroup} value=${d.types} size="small" color="slate" selectedColor="primary" itemSizing="natural" aria-label="Report type" onChange=${function (v) { d.types = v; render(); }}>
            ${REPORT_TYPES.map(function (o) { return html`<${Button} key=${o[0]} value=${o[0]}>${{ form_and_annotation: 'Forms and Annotations', task_detail: 'Task Details' }[o[0]] || o[1]}</${Button}>`; })}
          </${ButtonGroup}>
        </${WrappedInput}>
        ${!S.showNames ? html`<${AlertPanel} severity="warning" title="Names Are Coded Here Only" description="The report lists assignees as stored in Flywheel." />` : null}
        ${!d.protocolId ? html`<${AlertPanel} severity="error" title="No Protocol ID" description="This protocol’s tasks carry no protocol ID, so the queue can’t take it." />` : null}
        <${CollapseLayout} title="Request" description="What this sends to the platform" bordered rounded dense>
          <pre class="log">${req}</pre>
        </${CollapseLayout}>
      </div>
    </${Dialog}>`;
  }
  function DeleteDialog() {
    var r = S.delConfirm;
    return html`<${Dialog} open width="extra-small" title="Delete Report?" icon="trash-delete" iconColor="red" onClose=${closeDialogs}
      description=${typeLabel(r.report_type) + ' report from ' + fmtT(r.created) + ' is removed from the project’s Task Report Queue for everyone. This can’t be undone.'}
      actions=${html`<${Frag}><${Button} size="small" variant="outlined" color="slate" onClick=${closeDialogs}>Cancel</${Button}>
        <${Button} size="small" color="red" startIcon="trash-delete" onClick=${function () { S.delConfirm = null; deleteReport(r); render(); }}>Delete Report</${Button}></${Frag}>`} />`;
  }
  function Toasts() {
    if (!S.toast) return null;
    return html`<${SnackbarContainer} align="center"><${Snackbar} title=${S.toast} severity=${toastSeverity(S.toast)} showClose onClose=${function () { set({ toast: '' }); }} /></${SnackbarContainer}>`;
  }

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (S.reassign || S.exportDlg || S.delConfirm) closeDialogs();
    else if (S.readerSel || S.caseSel) closeSide();
  });

  var lastRefresh = 0;
  function refreshSoon(why) { if ((!S.ext && !S.demo) || S.loading || document.hidden || Date.now() - lastRefresh < 15000) return; lastRefresh = Date.now(); note('Refresh (' + why + ')'); load(true); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshSoon('back on this tab'); });
  setInterval(function () { refreshSoon('every 60 s'); }, 60000);

  // ---------------------------------------------------------------- demo data (shaped like the 23.x responses)
  var DEMO = (function () {
    var seed = 20261029, rnd = function () { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    var hex = function (n) { var s = ''; while (s.length < n) s += Math.floor(rnd() * 16).toString(16); return s; };
    var iso = function (d, h) { var x = new Date(); x.setHours(h == null ? 9 : h, Math.floor(rnd() * 60), 0, 0); x.setDate(x.getDate() + d); return x.toISOString(); };
    var users = [['Priya', 'Raman', 1], ['Marcus', 'Ellery', 1.15], ['Hana', 'Sato', 0.9], ['Daniel', 'Okafor', 0.35], ['Sofia', 'Lindqvist', 1], ['Owen', 'Brandt', 1.5], ['Mei', 'Chen', 1], ['Grace', 'Whitfield', 1.1]].map(function (u) { return { _id: hex(24), firstname: u[0], lastname: u[1], email: (u[0] + '.' + u[1]).toLowerCase() + '@readers.example.com', speed: u[2] }; });
    var me = { _id: hex(24), firstname: 'Data', lastname: 'Manager', email: 'data.manager@example.com' };
    var group = 'reading-ops';
    var projects = [{ _id: hex(24), label: 'TBI-HEM-01', group: group }, { _id: hex(24), label: 'ONC-RECIST-02', group: group }, { _id: hex(24), label: 'Neuro PET', group: group }, { _id: hex(24), label: 'WRC-Pilot', group: group }];
    var roles = [{ _id: 'role-admin', label: 'Read-Write + Task Admin', actions: ['tasks_view', 'tasks_assign', 'tasks_manage'] }, { _id: 'role-reader', label: 'Blinded Reader', actions: ['tasks_view'] }];
    projects.forEach(function (p, i) { p.permissions = [{ _id: me._id, role_ids: [i === 3 ? 'role-reader' : 'role-admin'] }]; });
    var tasks = [], n = 0;
    function mk(proj, proto, protoId, ver, caseIdx, readNo, reader, created, due, status, med, adj) {
      n++;
      var subj = 'Case ' + (1270 + caseIdx), ses = hex(24);
      var t = { _id: hex(24), task_id: 'R-' + (1270 + caseIdx) + '-' + readNo, created: created, status: status, priority: ['medium', 'medium', 'high', 'low'][Math.floor(rnd() * 4)], protocol_label: proto, protocol_id: protoId, protocol_version: ver,
        assignee: reader ? { type: 'user', id: reader._id } : { type: 'staffing_pool', id: 'pool-' + protoId.slice(0, 6) }, parents: { group: group, project: proj._id, subject: hex(24), session: ses }, due_date: due.slice(0, 10), subcategory: adj ? 'adjudication' : 'read',
        parent_details: { project_label: proj.label, subject_label: subj, session_label: 'V1' }, creator: me._id, parent_ref: { type: 'session', id: 'ses-' + proj._id.slice(0, 4) + '-' + caseIdx, label: 'V1' }, read_number: adj ? null : readNo, transitions: { todo: created }, modified: created };
      var c0 = Math.round((Date.parse(created) - Date.now()) / 864e5), spanD = Math.max(1, -c0 - 1);
      if (status === 'in_progress') t.transitions.in_progress = iso(Math.min(0, -Math.floor(rnd() * Math.min(6, spanD))));
      if (status === 'completed') t.transitions.in_progress = iso(Math.min(-1, c0 + 1 + Math.floor(Math.pow(rnd(), 0.8) * spanD)));
      if (status === 'completed') { var m = Math.max(2, Math.round(med * (reader && reader.speed ? reader.speed : 1) * (0.7 + rnd() * 0.6))); t.transitions.completed = new Date(Date.parse(t.transitions.in_progress) + m * 6e4).toISOString(); t.modified = t.transitions.completed; }
      if (adj) t.adjudication = { decision: status === 'completed' ? ['Read 1', 'Read 2', 'Own value'][Math.floor(rnd() * 3)] : null };
      tasks.push(t); return t;
    }
    var tbi = projects[0], onc = projects[1], pidR = hex(24), pidA = hex(24), pidO = hex(24);
    for (var i = 0; i < 40; i++) {
      var batch = Math.floor(i / 10), cr = iso(-34 + batch * 7), due = iso(-34 + batch * 7 + 21), prog = i / 40;
      var a = users[Math.floor(rnd() * 6)], b; do { b = users[Math.floor(rnd() * 6)]; } while (b === a);
      var st = function () { var u = rnd(); return prog < 0.5 ? (u < 0.94 ? 'completed' : 'in_progress') : prog < 0.7 ? (u < 0.45 ? 'completed' : u < 0.75 ? 'in_progress' : 'todo') : (u < 0.08 ? 'in_progress' : 'todo'); };
      var s1 = st(), s2 = st(), r2 = prog > 0.88 && rnd() < 0.6 ? null : b;
      if (!r2) s2 = 'todo';
      mk(tbi, 'Hemorrhage read · CT head', pidR, '3', i, 1, a, cr, due, s1, 19);
      mk(tbi, 'Hemorrhage read · CT head', pidR, '3', i, 2, r2, cr, due, s2, 19);
      var both = s1 === 'completed' && s2 === 'completed', u2 = rnd();
      var adjSt = !both ? 'blocked' : u2 < 0.62 ? 'cancelled' : u2 < 0.8 ? 'completed' : u2 < 0.9 ? 'todo' : u2 < 0.95 ? 'in_progress' : 'blocked';
      mk(tbi, 'Hemorrhage read · CT head', pidR, '3', i, 3, users[6 + (i % 2)], cr, iso(-34 + batch * 7 + 28), adjSt, 11, true);
    }
    for (var j = 0; j < 20; j++) {
      var crO = iso(-30 + Math.floor(j / 8) * 8), dueO = iso(-30 + Math.floor(j / 8) * 8 + 24), pg = j / 20;
      [1, 2].forEach(function (rn) { var u = rnd(), s = pg < 0.4 ? (u < 0.9 ? 'completed' : 'in_progress') : pg < 0.6 ? (u < 0.5 ? 'in_progress' : 'todo') : 'todo'; mk(onc, 'RECIST 1.1 longitudinal read', pidO, '1', j, rn, users[[2, 4, 6, 7, 0][(j + rn) % 5]], crO, dueO, s, 34); });
    }
    for (var k = 0; k < 4; k++) mk(projects[3], 'GA area \u00b7 FAF', hex(24), '1', 900 + k, 1, me, iso(-10), iso(5), k < 2 ? 'completed' : 'todo', 9);
    var reports = [{ _id: hex(24), project_id: tbi._id, protocol_id: pidR, report_type: 'form_and_annotation', status: 'completed', created: iso(-12, 17), size: 146000, origin: { type: 'user', id: me._id } }];
    function csv(pid, type) {
      if (type === 'task_detail') return 'Task ID,Protocol Label,Task Assignee,Task Status,Subject Label,Completed\n' + tasks.filter(function (t) { return t.parents.project === pid; }).slice(0, 80).map(function (t) { var u = users.filter(function (x) { return x._id === (t.assignee || {}).id; })[0]; return [t.task_id, t.protocol_label, u ? u.email : '', t.status, t.parent_details.subject_label, doneAt(t) || ''].join(','); }).join('\n') + '\n';
      var head = 'Task ID,Task Type,Protocol Label,Task Assignee,Task Status,Subject Label,Session Label,Question,Answer\n';
      return head + tasks.filter(function (t) { return t.parents.project === pid && t.status === 'completed' && !t.adjudication; }).slice(0, 60).map(function (t) { var u = users.filter(function (x) { return x._id === t.assignee.id; })[0]; return [t.task_id, 'Read', t.protocol_label, u ? u.email : '', 'Complete', t.parent_details.subject_label, 'V1', 'Hemorrhage present', rnd() < 0.7 ? 'Yes' : 'No'].join(','); }).join('\n') + '\n';
    }
    function ok(v) { return new Promise(function (res) { setTimeout(function () { res(JSON.parse(JSON.stringify(v))); }, 60 + rnd() * 120); }); }
    function no(status) { return new Promise(function (res, rej) { setTimeout(function () { rej({ status: status, message: 'demo ' + status }); }, 80); }); }
    function request(method, path, params, body) {
      var m;
      if (method === 'GET' && path === '/api/tasks/reader') { var sk = (params && params.skip) || 0, lim = (params && params.limit) || 50; return ok({ count: Math.min(lim, tasks.length - sk), total: tasks.length, results: tasks.slice(sk, sk + lim) }); }
      if (method === 'GET' && path === '/api/projects') return ok(projects.map(function (p) { return { _id: p._id, label: p.label, group: p.group }; }));
      if (method === 'GET' && path === '/api/roles') return ok(roles);
      if (method === 'GET' && (m = /^\/api\/projects\/([^/]+)$/.exec(path))) { var pp = projects.filter(function (p) { return p._id === m[1]; })[0]; return pp ? ok(pp) : no(404); }
      if (method === 'GET' && path === '/api/users') return ok(users.concat([me]));
      if (method === 'GET' && path === '/api/reports') { reports.forEach(function (r) { if (r.t0) { var el = Date.now() - r.t0; r.status = el < 2500 ? 'pending' : el < 6000 ? 'in_progress' : 'completed'; if (r.status === 'completed') { r.size = r.report_type === 'task_detail' ? 38000 : 146000; delete r.t0; } } }); return ok({ count: reports.length, total: reports.length, results: reports.filter(function (r) { return !params || !params.project_id || r.project_id === params.project_id; }) }); }
      if (method === 'PUT' && (m = /^\/api\/tasks\/reader\/([^/]+)\/assign$/.exec(path))) { var t = tasks.filter(function (x) { return x._id === m[1]; })[0]; if (!t) return no(404); t.assignee = body.assignee; return ok({ modified: 1 }); }
      if (method === 'POST' && (m = /^\/api\/(form_and_annotation|task_detail)\/reports$/.exec(path))) { var nr = { _id: hex(24), project_id: body.project_id, protocol_id: body.protocol_id, report_type: m[1], status: 'pending', created: new Date().toISOString(), origin: { type: 'user', id: me._id }, t0: Date.now() }; reports.unshift(nr); return ok(nr); }
      if (method === 'GET' && (m = /^\/api\/(form_and_annotation|task_detail)\/reports\/([^/]+)\/csv$/.exec(path))) { var rr = reports.filter(function (r) { return r._id === m[2]; })[0]; return rr ? ok(csv(rr.project_id, m[1])) : no(404); }
      if (method === 'DELETE' && (m = /^\/api\/(form_and_annotation|task_detail)\/reports\/([^/]+)$/.exec(path))) { reports = reports.filter(function (r) { return r._id !== m[2]; }); return ok({ deleted: 1 }); }
      return no(404);
    }
    return { request: request, me: me };
  })();
  function startDemo() {
    S.demo = true; S.error = null; S.user = DEMO.me; S.origin = ''; S.params = {};
    note('Demo mode: mock data shaped like the 23.x API. No network calls to Flywheel.');
    fromHash(); load();
  }
  render();
  connect();
})();
</script>
